  <style>
  
	@font-face {
	  font-family: checkin;
	  src: url('./bmw/Regular.otf') format('opentype');
	}
		@font-face {
	  font-family: checkin;
		  font-weight:bold;
	  src: url('./bmw/Regular.otf') format('opentype');
	}
		@font-face {
	  font-family: checkinlight;
		  font-weight:50;
	  src: url('./bmw/Light.otf') format('opentype');
	}
			@font-face {
	  font-family: checkin;
		  font-weight:10;
	  src: url('./bmw/Regular.otf') format('opentype');
	}

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
	  font-weight:100;
      background: #111;
      font-family: checkin;
	  line-height: 2;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #111;
    }

    .header {
      flex: 0 0 auto;
      min-height: 50px;
      padding:
        max(8px, env(safe-area-inset-top))
        12px
        8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #111;
      color: #fff;
      border-bottom: 1px solid #2e2e2e;
    }

    .title {
      min-width: 0;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
	  line-height: 2;
    }

    .open-btn {
      flex: 0 0 auto;
      padding: 8px 10px;
      border: 1px solid #555;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
    }

    .viewer {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      background: #222;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b1b1b;
      color: #fff;
      font-size: 14px;
      z-index: 2;
      pointer-events: none;
    }

    .loading.hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .header {
        min-height: 46px;
	    line-height: 2;
      }

      .title {
        font-size: 14px;
	    line-height: 2;
      }
    }
  </style>

<body>
  <div class="app">
    <header class="header">
      <div class="title">THE NEW BMW 7 – DẤU ẤN NGƯỜI DẪN ĐẦU</div>

      <!--<a
        class="open-btn"
        href="https://drive.google.com/file/d/1bPV884sXDNJ_41afeuzcbtPKWj7yV-2g/view?usp=drivesdk"
        target="_blank"
        rel="noopener noreferrer">
        Open in Drive
      </a>-->
    </header>

    <main class="viewer">
      <div class="loading" id="loading">Loading brochure…</div>

      <iframe
        id="pdfFrame"
        src="https://drive.google.com/file/d/1bPV884sXDNJ_41afeuzcbtPKWj7yV-2g/preview"
        title="The New BMW 7 Brochure"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </main>
  </div>

  <script>
    const frame = document.getElementById("pdfFrame");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", function () {
      loading.classList.add("hidden");
    });
  </script>
</body>
